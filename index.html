<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-bottom: 1.5rem;
            color: #333;
        }
        .btn {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 24px;
            margin: 0 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.85;
        }
        .btn-on {
            background-color: #4CAF50;
            color: white;
        }
        .btn-off {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Light Control</h1>
        <button class="btn btn-on" onclick="controlLight('http://192.168.1.160/all/on')">Turn ON</button>
        <button class="btn btn-off" onclick="controlLight('http://192.168.1.160/all/off')">Turn OFF</button>
    </div>

    <script>
        function controlLight(url) {
            // mode: 'no-cors' prevents CORS blocking if the light's web server doesn't send CORS headers
            fetch(url, { mode: 'no-cors' })
                .then(() => console.log(`Request sent to ${url}`))
                .catch(error => console.error('Error sending request:', error));
        }
    </script>

</body>
</html>
