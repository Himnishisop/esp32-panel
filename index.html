<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMBEAT Control Hub</title>
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ff1a1a; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 26, 26, 0.4); }
        .config-box { margin-bottom: 15px; background: #141414; padding: 10px; border-radius: 8px; display: inline-block; border: 1px solid #333; }
        input[type="text"] { background: #222; color: #fff; border: 1px solid #ff1a1a; padding: 6px; border-radius: 4px; text-align: center; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 20px; background: #222; border: 1px solid #444; }
        .online { background: #003300; color: #00ff66; border-color: #009933; }
        .offline { background: #330000; color: #ff4d4d; border-color: #990000; }
        .card { background: #141414; border: 1px solid #260000; border-radius: 12px; padding: 20px; margin: 15px auto; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        h3 { margin-top: 0; color: #ff4d4d; }
        .btn-group { display: flex; justify-content: space-around; margin: 15px 0; }
        button { background: #1f1f1f; color: white; border: 1px solid #ff1a1a; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 45%; }
        button:hover { background: #ff1a1a; box-shadow: 0 0 12px rgba(255, 26, 26, 0.6); }
        .color-picker-box { margin-top: 15px; }
        input[type="color"] { -webkit-appearance: none; border: none; width: 100%; height: 50px; border-radius: 8px; cursor: pointer; background: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid #ff1a1a; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>BOMBEAT HUB</h1>
    
    <div class="config-box">
        <label style="font-size: 12px; color: #aaa;">ESP32 IP: </label>
        <input type="text" id="espIpInput" value="http://192.168.1.199" style="width: 140px;">
    </div>
    <br>
    <div id="statusBadge" class="status-badge offline">Connecting to Hub...</div>
    
    <div class="card">
        <h3>CLK-BLEDDM Strip</h3>
        <div class="btn-group">
            <button onclick="sendCmd('/api/clk/on')">ON</button>
            <button onclick="sendCmd('/api/clk/off')">OFF</button>
        </div>
        <div class="color-picker-box">
            <p style="font-size: 13px; color: #aaa;">Custom Color Picker</p>
            <input type="color" id="colorPicker" value="#ffffff" onchange="updateColor(this.value)">
        </div>
    </div>

    <div class="card">
        <h3>GATT--DEMO Power</h3>
        <div class="btn-group">
            <button onclick="sendCmd('/api/gatt/on')">ON</button>
            <button onclick="sendCmd('/api/gatt/off')">OFF</button>
        </div>
    </div>

    <script>
        function getBaseUrl() {
            return document.getElementById('espIpInput').value.trim();
        }

        function sendCmd(endpoint) {
            let url = getBaseUrl() + endpoint;
            fetch(url)
                .then(response => console.log("Command sent: " + endpoint))
                .catch(err => alert("Failed to reach ESP32 hub at " + url));
        }

        function updateColor(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            let url = `${getBaseUrl()}/api/clk/color?r=${r}&g=${g}&b=${b}`;
            fetch(url)
                .then(res => console.log(`Color set: R=${r} G=${g} B=${b}`))
                .catch(err => alert("Failed to send color packet."));
        }

        // Poll ESP32 status every 2 seconds
        setInterval(() => {
            let url = getBaseUrl() + '/api/status';
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const badge = document.getElementById('statusBadge');
                    if (data.phoneConnected) {
                        badge.className = "status-badge online";
                        badge.innerText = "🟢 Phone Connected (Lights ON)";
                    } else {
                        badge.innerText = "🟡 Phone Out / Standby";
                        badge.className = "status-badge offline";
                    }
                })
                .catch(() => {
                    const badge = document.getElementById('statusBadge');
                    badge.className = "status-badge offline";
                    badge.innerText = "🔴 Hub Unreachable";
                });
        }, 2000);
    </script>
</body>
</html>
