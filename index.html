<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLK-BLEDDM Packet Test Studio</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1f2833;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      width: 320px;
      text-align: center;
      border: 1px solid #45a29e;
    }
    h2 { color: #66fcf1; margin-bottom: 5px; }
    p { font-size: 13px; color: #8e8e93; margin-bottom: 25px; }
    .btn {
      width: 100%;
      padding: 14px 0;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .btn-connect { background-color: #a259ff; color: white; }
    .btn-on { background-color: #45a29e; color: #0b0c10; }
    .btn-off { background-color: #e63946; color: white; }
    .btn-custom { background-color: #2b2d42; color: #8d99ae; border: 1px solid #8d99ae; }
    #log {
      margin-top: 15px;
      padding: 10px;
      background: #0b0c10;
      border-radius: 8px;
      font-family: monospace;
      font-size: 11px;
      color: #66fcf1;
      word-break: break-all;
      min-height: 40px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>CLK Packet Tester</h2>
    <p>Direct Web Bluetooth Direct Connection</p>

    <button class="btn btn-connect" onclick="connectBLE()">1. CONNECT CLK-BLEDDM</button>
    <button class="btn btn-on" onclick="sendPacket('on')">TEST TRUE ON (04 Command)</button>
    <button class="btn btn-off" onclick="sendPacket('off')">TEST TRUE OFF (04 Command)</button>
    <button class="btn btn-custom" onclick="sendPacket('capture8634')">TEST FRAME 8634 (Capture)</button>

    <div id="log">Status: Click Connect...</div>
  </div>

  <script>
    const SERVICE_UUID = "0000fff0-0000-1000-8000-00805f9b34fb";
    const WRITE_UUID   = "0000fff3-0000-1000-8000-00805f9b34fb";

    // Captured Power & Frame Packets
    const packets = {
      on:          [0x7E, 0x04, 0x04, 0xF0, 0x00, 0x01, 0xFF, 0x00, 0xEF],
      off:         [0x7E, 0x04, 0x04, 0x00, 0x00, 0x00, 0xFF, 0x00, 0xEF],
      capture8634: [0x7E, 0x07, 0x83, 0x0D, 0x17, 0x1A, 0x02, 0xFF, 0xEF]
    };

    let targetCharacteristic = null;

    function log(msg) {
      document.getElementById('log').innerText = msg;
      console.log(msg);
    }

    async function connectBLE() {
      try {
        log("Searching for CLK-BLEDDM...");
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'CLK' }],
          optionalServices: [SERVICE_UUID]
        });

        log(`Connecting to ${device.name}...`);
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        targetCharacteristic = await service.getCharacteristic(WRITE_UUID);

        log(`Connected! Ready to send packets.`);
      } catch (error) {
        log(`Connection Error: ${error.message}`);
      }
    }

    async function sendPacket(type) {
      if (!targetCharacteristic) {
        log("Error: Connect to CLK via Bluetooth first!");
        return;
      }

      try {
        const payload = Uint8Array.from(packets[type]);
        await targetCharacteristic.writeValueWithoutResponse(payload);
        
        const hexStr = Array.from(payload).map(b => b.toString(16).padStart(2, '0')).join(' ');
        log(`Sent [${type.toUpperCase()}]: ${hexStr}`);
      } catch (error) {
        log(`Write Error: ${error.message}`);
      }
    }
  </script>
</body>
</html>
