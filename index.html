<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOMBEAT Hub - Movie Mode</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1015; color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; width: 320px; }
        h2 { margin-bottom: 5px; font-weight: 600; letter-spacing: 0.5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; margin-top: 10px; }
        .btn-movie { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-movie:active { transform: scale(0.97); }
        .btn-end { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-end:active { transform: scale(0.97); }
        .status { margin-top: 20px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <h2>BOMBEAT Hub</h2>
        <p>Smart Room Control Center</p>
        <button class="btn btn-movie" onclick="toggleMovieMode('on')">🎬 Enable Movie Mode</button>
        <button class="btn btn-end" onclick="toggleMovieMode('off')">🛑 End Movie Mode</button>
        <div class="status" id="statusText">System Ready</div>
    </div>
    <script>
        const ESP_IP = "http://192.168.1.199";

        function toggleMovieMode(action) {
            document.getElementById('statusText').innerText = "Processing command...";
            fetch(ESP_IP + '/moviemode/' + action)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('statusText').innerText = data.movieMode ? "🎬 Movie Mode Active" : "💡 Normal Mode Active";
                })
                .catch(err => {
                    document.getElementById('statusText').innerText = "⚠️ Connection error to ESP32";
                });
        }
    </script>
</body>
</html>
